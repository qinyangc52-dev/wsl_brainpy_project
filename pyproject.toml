[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmm-brainpy"
version = "0.1.0"
description = "BrainPy refactor of the Extended Criticality Modular Model"
requires-python = ">=3.11"
dependencies = [
  "brainpy==2.8.2",
  "numpy",
  "scipy",
  "PyYAML",
  "h5py",
]

[project.optional-dependencies]
test = ["pytest"]
analysis = ["powerlaw", "matplotlib"]

[project.scripts]
ecmm = "ecmm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
